[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "gpf"
version = "0.1.0"
description = "Gerente de Projetos do Futuro — gerência de projetos AI-First (PMBOK 8, PRINCE2 7, PM4R)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.162.0",
  "uvicorn[standard]>=0.54.0",
  "pydantic>=2.8",
]

[project.optional-dependencies]
# Modelos preditivos de risco (gradient boosting, Random Forest, DBSCAN, TF-IDF)
ml = [
  "scikit-learn>=1.5",
  "numpy>=2.0",
  "joblib>=1.4",
]
# Motor XGBoost opcional (o padrão é o gradient boosting do scikit-learn)
xgboost = ["xgboost>=2.1"]
# Índice semântico com Transformers (baixa ~470 MB de modelo; use com GPU ou CPU folgada)
nlp = ["sentence-transformers>=3.0"]
dev = [
  "gpf[ml]",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.17.3",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "pip-audit>=2.10.1",
]

[project.scripts]
gpf-train = "gpf.ml.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gpf"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["gpf"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*", "xgboost.*", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --cov=gpf --cov-report=term-missing --cov-fail-under=80"
