name: Entrega (CD)

# Depois da CI verde na main:
#   1. publica a imagem no GHCR com a tag do commit (sha);
#   2. promove essa imagem para homologação (tag "homologacao");
#   3. espera a aprovação do ambiente "producao" e promove para produção (tag "producao").
# O servidor da universidade busca as tags sozinho (deploy/atualizar.sh). O GitHub nunca acessa o servidor.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: entrega
  cancel-in-progress: false

env:
  SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  publicar-imagem:
    name: Publicar imagem no GHCR
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.nome.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - id: nome
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Login no GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build e push (tags sha e latest)
        env:
          IMAGE: ${{ steps.nome.outputs.image }}
        run: |
          docker build -t "$IMAGE:$SHA" -t "$IMAGE:latest" \
            --label org.opencontainers.image.source="https://github.com/${{ github.repository }}" \
            --label org.opencontainers.image.revision="$SHA" .
          docker push "$IMAGE:$SHA"
          docker push "$IMAGE:latest"

  homologacao:
    name: Promover para homologação
    needs: publicar-imagem
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: homologacao
    permissions:
      packages: write
    steps:
      - name: Login no GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Marcar a imagem como homologação
        env:
          IMAGE: ${{ needs.publicar-imagem.outputs.image }}
        run: |
          docker buildx imagetools create -t "$IMAGE:homologacao" "$IMAGE:$SHA"
          echo "### Homologação recebe \`${SHA:0:7}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "O servidor aplica a nova versão em até 2 minutos. Teste e depois aprove a produção." >> "$GITHUB_STEP_SUMMARY"

  producao:
    name: Promover para produção
    needs: [publicar-imagem, homologacao]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: producao # exige aprovação manual (Settings → Environments → producao)
    permissions:
      packages: write
    steps:
      - name: Login no GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Marcar a imagem como produção
        env:
          IMAGE: ${{ needs.publicar-imagem.outputs.image }}
        run: |
          docker buildx imagetools create -t "$IMAGE:producao" "$IMAGE:$SHA"
          echo "### Produção recebe \`${SHA:0:7}\`" >> "$GITHUB_STEP_SUMMARY"
